services:
  db:
    image: postgres:17-alpine
    container_name: sankalp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sankalp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sankalp_password_placeholder}
      POSTGRES_DB: ${POSTGRES_DB:-sankalp_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
